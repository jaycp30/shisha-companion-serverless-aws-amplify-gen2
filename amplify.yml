# Amplify Hosting build spec.
#
# The BACKEND phase runs `ampx pipeline-deploy`, which deploys this branch's own
# backend (its own AppSync API, Lambdas and S3 bucket — separate from anyone's local
# `ampx sandbox`) and writes a fresh amplify_outputs.json. That file is gitignored, so
# it does not exist in the repo: it is generated here, at build time, which is exactly
# why the backend phase must run before the frontend one.
#
# `pipeline-deploy` is the CI counterpart to `sandbox` — never run it by hand.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
