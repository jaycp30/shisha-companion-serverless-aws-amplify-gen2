AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Amplify Hosting for Shisha Companion — connects a GitHub repo to Amplify, which then
  builds the frontend AND deploys the Gen 2 backend on every push to the branch.

  SCOPE: this template provisions the HOSTING APP and its deploy role only. The backend
  (AppSync, Lambdas, S3, Bedrock IAM) is NOT here — it is defined in amplify/ and
  deployed by `ampx pipeline-deploy` during the Amplify build. Amplify Gen 2 already is
  infrastructure-as-code; this is the layer that kicks it off.

Parameters:
  AppName:
    Type: String
    Default: shisha-companion
    Description: Name for the Amplify app.

  RepositoryUrl:
    Type: String
    Description: >
      HTTPS URL of the GitHub repository, e.g.
      https://github.com/your-user/shisha-companion-serverless-aws-amplify-gen2
    AllowedPattern: ^https://github\.com/[^/]+/[^/]+$
    ConstraintDescription: Must be an https://github.com/owner/repo URL.

  BranchName:
    Type: String
    Default: main
    Description: Branch to build and deploy.

  GitHubAccessToken:
    Type: String
    NoEcho: true
    Description: >
      GitHub personal access token. CloudFormation cannot use the Amplify GitHub App
      (that handshake is console-only), so a token is required here.

      USE A FINE-GRAINED TOKEN SCOPED TO THIS ONE REPOSITORY — Contents: read,
      Metadata: read, Webhooks: read and write. Do NOT use a classic token with blanket
      `repo` scope: that would hand AWS access to every repository you own.

Resources:
  # The role Amplify assumes to run CloudFormation for the Gen 2 backend during a build.
  #
  # NOTE ON PRIVILEGE: AmplifyBackendDeployFullAccess is a BROAD AWS-managed policy — it
  # can create Lambdas, AppSync APIs, S3 buckets, and IAM roles, because that is
  # genuinely what deploying this backend requires. It is the AWS-recommended role for
  # Gen 2 CI, but it is not least-privilege, and it is worth knowing that rather than
  # discovering it later.
  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-amplify-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmplifyBackendDeployFullAccess
      Tags:
        - Key: Project
          Value: shisha-buddy
        - Key: Stack
          Value: AmplifyHosting

  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Ref AppName
      Repository: !Ref RepositoryUrl
      AccessToken: !Ref GitHubAccessToken
      IAMServiceRole: !GetAtt AmplifyServiceRole.Arn
      # Platform WEB = a static build. (WEB_COMPUTE is for SSR frameworks; this is a
      # Vite SPA, so the artifacts are just files.)
      Platform: WEB

      # No BuildSpec here ON PURPOSE. amplify.yml lives in the repo root and Amplify
      # picks it up automatically — inlining a copy here would create a second source of
      # truth that silently drifts out of sync with the one developers actually edit.

      # Single-page app: serve index.html for anything that isn't a real asset, so a
      # deep link or a refresh doesn't 404.
      CustomRules:
        - Source: >-
            </^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|mp4|webm|mp3|mov)$)([^.]+$)/>
          Target: /index.html
          Status: '200'

      Tags:
        - Key: Project
          Value: shisha-buddy
        - Key: Stack
          Value: AmplifyHosting

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref BranchName
      # Every push to this branch rebuilds the frontend AND redeploys the backend.
      EnableAutoBuild: true
      Stage: PRODUCTION
      Framework: React
      Tags:
        - Key: Project
          Value: shisha-buddy
        - Key: Stack
          Value: AmplifyHosting

Outputs:
  AppId:
    Description: Amplify app id.
    Value: !GetAtt AmplifyApp.AppId

  AppUrl:
    Description: The live app.
    Value: !Sub 'https://${BranchName}.${AmplifyApp.DefaultDomain}'

  ConsoleUrl:
    Description: Amplify console for this app (watch the build here).
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/amplify/apps/${AmplifyApp.AppId}'
