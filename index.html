<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the fixed bottom controls pad themselves out of the
         notch / home-indicator area via env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shisha Companion — flavor picks & a session buddy</title>
    <meta
      name="description"
      content="Snap a shisha menu for AI flavor picks and pairings, then hang out with a cozy animated session buddy that keeps time on your coals."
    />
    <!-- Matches the linen background so the mobile browser chrome blends with the app. -->
    <meta name="theme-color" content="#f5f0e6" />
    <!-- Open Graph / Twitter for link previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shisha Companion — flavor picks & a session buddy" />
    <meta
      property="og:description"
      content="Snap a shisha menu for AI flavor picks and pairings, then hang out with a cozy animated session buddy."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
